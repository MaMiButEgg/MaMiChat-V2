<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>mamichat</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-app.js";
  import {
    getFirestore, collection, doc, setDoc, getDoc, updateDoc,
    arrayUnion, arrayRemove, onSnapshot, addDoc, query, where, orderBy, serverTimestamp
  } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore.js";

  /* =========================================================
     BURAYI DOLDUR — Firebase Console > Project settings > Your apps
     ========================================================= */
  const firebaseConfig = {
    apiKey: "AIzaSyCxXN9TYHC9sNpD6Qj1rmlvSA1DVssr7xQ",
    authDomain: "mamichatv2.firebaseapp.com",
    projectId: "mamichatv2",
    storageBucket: "mamichatv2.firebasestorage.app",
    messagingSenderId: "814980978657",
    appId: "1:814980978657:web:d86c50ccab2627f66be4a0"
  };

  /* =========================================================
     BURAYI DOLDUR — cloudinary.com hesabından
     (Dashboard > Cloud name, Settings > Upload > Upload presets > Unsigned preset adı)
     ========================================================= */
  const CLOUDINARY_CLOUD_NAME = "fczzeuvn";
  const CLOUDINARY_UPLOAD_PRESET = "MaMiChat";
  /* ========================================================= */

  const MAX_GROUP_SIZE = 12;

  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);

  // ---------- yardımcılar ----------
  const $ = (sel) => document.querySelector(sel);
  const norm = (s) => s.trim().toLowerCase();
  const convId = (a, b) => [norm(a), norm(b)].sort().join("__");

  async function sha256(text) {
    const buf = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(text));
    return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2, "0")).join("");
  }

  function fmtTime(ts) {
    if (!ts) return "--:--:--";
    const d = ts.toDate ? ts.toDate() : new Date();
    return d.toLocaleTimeString("tr-TR", { hour: "2-digit", minute: "2-digit", second: "2-digit" });
  }

  function attachmentUrl(url) {
    // cloudinary URL'sine fl_attachment ekleyerek tıklayınca indirmeye zorluyoruz
    return url.replace("/upload/", "/upload/fl_attachment/");
  }

  async function getUserDoc(name) {
    const snap = await getDoc(doc(db, "users", norm(name)));
    return snap.exists() ? snap.data() : null;
  }

  // ---------- state ----------
  let me = null;
  let activeChat = null; // { type: 'dm'|'group', id, name, members? }
  let unsubMessages = null;
  let unsubContacts = null;
  let unsubGroups = null;
  let myFriends = [];
  let myGroups = [];

  function showScreen(id) {
    document.querySelectorAll(".screen").forEach(s => s.classList.remove("active"));
    $(id).classList.add("active");
  }

  function setAuthMsg(text, isError = true) {
    const el = $("#auth-msg");
    el.textContent = text;
    el.style.color = isError ? "var(--danger)" : "var(--ok)";
  }
  function setSideMsg(text, isError = true) {
    const el = $("#chat-side-msg");
    el.textContent = text;
    el.style.color = isError ? "var(--danger)" : "var(--ok)";
  }

  // ---------- kayıt / giriş ----------
  async function register() {
    const name = $("#reg-name").value.trim();
    const pass = $("#reg-pass").value;
    if (!name || !pass) return setAuthMsg("kullanıcı adı ve şifre boş olamaz.");
    if (name.includes("__") || name.includes("/") || name.includes(",")) return setAuthMsg("kullanıcı adı '__', ',' veya '/' içeremez.");

    const existing = await getUserDoc(name);
    if (existing) return setAuthMsg("bu kullanıcı adı zaten alınmış.");

    const passHash = await sha256(pass);
    await setDoc(doc(db, "users", norm(name)), { displayName: name, passHash, createdAt: serverTimestamp() });
    await setDoc(doc(db, "contacts", norm(name)), { friends: [], incoming: [], outgoing: [] });
    setAuthMsg("kayıt tamam. şimdi giriş yapabilirsin.", false);
    $("#reg-name").value = ""; $("#reg-pass").value = "";
  }

  async function login() {
    const name = $("#login-name").value.trim();
    const pass = $("#login-pass").value;
    if (!name || !pass) return setAuthMsg("kullanıcı adı ve şifre boş olamaz.");

    const data = await getUserDoc(name);
    if (!data) return setAuthMsg("böyle bir kullanıcı yok.");

    const passHash = await sha256(pass);
    if (data.passHash !== passHash) return setAuthMsg("şifre yanlış.");

    me = data.displayName;
    enterChat();
  }

  function logout() {
    me = null; activeChat = null; myFriends = []; myGroups = [];
    if (unsubMessages) unsubMessages();
    if (unsubContacts) unsubContacts();
    if (unsubGroups) unsubGroups();
    $("#login-name").value = ""; $("#login-pass").value = "";
    setAuthMsg("", false);
    showScreen("#screen-auth");
  }

  // ---------- giriş sonrası ----------
  function enterChat() {
    $("#me-label").textContent = me;
    showScreen("#screen-chat");
    listenContacts();
    listenGroups();
  }

  function listenContacts() {
    if (unsubContacts) unsubContacts();
    unsubContacts = onSnapshot(doc(db, "contacts", norm(me)), (snap) => {
      const data = snap.exists() ? snap.data() : { friends: [], incoming: [], outgoing: [] };
      myFriends = data.friends || [];
      renderRequests(data.incoming || []);
      renderFriends(myFriends);
    });
  }

  function listenGroups() {
    if (unsubGroups) unsubGroups();
    const q = query(collection(db, "groups"), where("members", "array-contains", me));
    unsubGroups = onSnapshot(q, (snap) => {
      myGroups = [];
      snap.forEach(d => myGroups.push({ id: d.id, ...d.data() }));
      renderGroups(myGroups);
    });
  }

  function renderRequests(list) {
    const box = $("#request-list");
    box.innerHTML = "";
    if (list.length === 0) { box.innerHTML = `<div class="empty-hint small">gelen istek yok</div>`; return; }
    list.forEach(name => {
      const row = document.createElement("div");
      row.className = "request-row";
      row.innerHTML = `<span>${name}</span>`;
      const acceptBtn = document.createElement("button");
      acceptBtn.textContent = "kabul et";
      acceptBtn.onclick = () => acceptRequest(name);
      const rejectBtn = document.createElement("button");
      rejectBtn.textContent = "reddet";
      rejectBtn.onclick = () => rejectRequest(name);
      row.appendChild(acceptBtn); row.appendChild(rejectBtn);
      box.appendChild(row);
    });
  }

  function renderFriends(list) {
    const box = $("#friend-list");
    box.innerHTML = "";
    if (list.length === 0) { box.innerHTML = `<div class="empty-hint small">henüz arkadaşın yok</div>`; return; }
    list.forEach(name => {
      const item = document.createElement("div");
      const isActive = activeChat && activeChat.type === "dm" && norm(activeChat.id) === norm(name);
      item.className = "contact" + (isActive ? " active" : "");
      item.textContent = name;
      item.onclick = () => openDM(name);
      box.appendChild(item);
    });
  }

  function renderGroups(list) {
    const box = $("#group-list");
    box.innerHTML = "";
    if (list.length === 0) { box.innerHTML = `<div class="empty-hint small">henüz grubun yok</div>`; return; }
    list.forEach(g => {
      const item = document.createElement("div");
      const isActive = activeChat && activeChat.type === "group" && activeChat.id === g.id;
      item.className = "contact" + (isActive ? " active" : "");
      item.textContent = `${g.name} (${g.members.length})`;
      item.onclick = () => openGroup(g);
      box.appendChild(item);
    });
  }

  // ---------- arkadaşlık istekleri ----------
  async function sendFriendRequest() {
    const target = $("#new-contact").value.trim();
    if (!target) return;
    if (norm(target) === norm(me)) return setSideMsg("kendine istek gönderemezsin.");

    const targetData = await getUserDoc(target);
    if (!targetData) return setSideMsg(`"${target}" adında kayıtlı kullanıcı yok.`);

    const realName = targetData.displayName;
    if (myFriends.some(f => norm(f) === norm(realName))) return setSideMsg("zaten arkadaşsınız.");

    await updateDoc(doc(db, "contacts", norm(me)), { outgoing: arrayUnion(realName) });
    await updateDoc(doc(db, "contacts", norm(realName)), { incoming: arrayUnion(me) });
    $("#new-contact").value = "";
    setSideMsg("istek gönderildi.", false);
  }

  async function acceptRequest(fromName) {
    await updateDoc(doc(db, "contacts", norm(me)), {
      incoming: arrayRemove(fromName), friends: arrayUnion(fromName)
    });
    await updateDoc(doc(db, "contacts", norm(fromName)), {
      outgoing: arrayRemove(me), friends: arrayUnion(me)
    });
  }

  async function rejectRequest(fromName) {
    await updateDoc(doc(db, "contacts", norm(me)), { incoming: arrayRemove(fromName) });
    await updateDoc(doc(db, "contacts", norm(fromName)), { outgoing: arrayRemove(me) });
  }

  // ---------- grup oluşturma ----------
  async function createGroup() {
    const name = prompt("grup adı:");
    if (!name) return;
    const raw = prompt(`eklemek istediğin arkadaşların kullanıcı adlarını virgülle yaz (en fazla ${MAX_GROUP_SIZE - 1} kişi, sen otomatik eklenirsin):`);
    if (!raw) return;

    const requested = [...new Set(raw.split(",").map(s => s.trim()).filter(Boolean))]
      .filter(n => norm(n) !== norm(me));

    if (requested.length > MAX_GROUP_SIZE - 1) {
      alert(`en fazla ${MAX_GROUP_SIZE - 1} kişi ekleyebilirsin (sen dahil ${MAX_GROUP_SIZE}).`);
      return;
    }

    const resolved = [me];
    for (const n of requested) {
      const data = await getUserDoc(n);
      if (!data) { alert(`"${n}" adında kayıtlı kullanıcı yok, grup oluşturulmadı.`); return; }
      if (!resolved.some(r => norm(r) === norm(data.displayName))) resolved.push(data.displayName);
    }

    await addDoc(collection(db, "groups"), {
      name, owner: me, members: resolved, createdAt: serverTimestamp()
    });
  }

  // ---------- sohbet açma ----------
  function openDM(partner) {
    activeChat = { type: "dm", id: partner, name: partner };
    $("#chat-partner").textContent = partner;
    renderFriends(myFriends); renderGroups(myGroups);
    subscribeMessages(collection(db, "chats", convId(me, partner), "messages"));
  }

  function openGroup(g) {
    activeChat = { type: "group", id: g.id, name: g.name, members: g.members };
    $("#chat-partner").textContent = `${g.name} (${g.members.join(", ")})`;
    renderFriends(myFriends); renderGroups(myGroups);
    subscribeMessages(collection(db, "groups", g.id, "messages"));
  }

  function subscribeMessages(colRef) {
    $("#message-input").disabled = false;
    $("#send-btn").disabled = false;
    $("#file-btn").disabled = false;
    $("#messages").innerHTML = "";
    if (unsubMessages) unsubMessages();
    const q = query(colRef, orderBy("createdAt", "asc"));
    unsubMessages = onSnapshot(q, (snap) => {
      $("#messages").innerHTML = "";
      snap.forEach(d => renderMessage(d.data()));
      $("#messages").scrollTop = $("#messages").scrollHeight;
    });
  }

  function activeCollection() {
    if (!activeChat) return null;
    return activeChat.type === "group"
      ? collection(db, "groups", activeChat.id, "messages")
      : collection(db, "chats", convId(me, activeChat.id), "messages");
  }

  // ---------- mesaj gösterimi ----------
  function renderMessage(msg) {
    const row = document.createElement("div");
    const mine = norm(msg.sender) === norm(me);
    row.className = "msg" + (mine ? " mine" : "");

    let body = "";
    if (msg.type === "file") {
      if (msg.resourceType === "image") {
        body = `<a href="${msg.url}" target="_blank"><img class="msg-media" src="${msg.url}"></a>
                <a class="dl-link" href="${attachmentUrl(msg.url)}" download>⬇ indir (${msg.fileName})</a>`;
      } else if (msg.resourceType === "video") {
        body = `<video class="msg-media" src="${msg.url}" controls></video>
                <a class="dl-link" href="${attachmentUrl(msg.url)}" download>⬇ indir (${msg.fileName})</a>`;
      } else {
        body = `<a class="file-chip" href="${attachmentUrl(msg.url)}" download>📎 ${msg.fileName} — indir</a>`;
      }
    } else {
      const span = document.createElement("span");
      span.textContent = msg.text;
      body = span.outerHTML;
    }

    row.innerHTML = `<span class="msg-time">[${fmtTime(msg.createdAt)}]</span> <span class="msg-sender">${msg.sender}:</span> <div class="msg-body">${body}</div>`;
    $("#messages").appendChild(row);
  }

  async function sendMessage() {
    const input = $("#message-input");
    const text = input.value.trim();
    if (!text || !activeChat) return;
    input.value = "";
    await addDoc(activeCollection(), { sender: me, type: "text", text, createdAt: serverTimestamp() });
  }

  async function uploadFile(file) {
    if (!activeChat) return;
    if (CLOUDINARY_CLOUD_NAME.startsWith("BURAYA")) {
      setSideMsg("önce Cloudinary bilgilerini dosyaya girmen lazım.");
      return;
    }
    setSideMsg(`yükleniyor: ${file.name}...`, false);
    const form = new FormData();
    form.append("file", file);
    form.append("upload_preset", CLOUDINARY_UPLOAD_PRESET);
    try {
      const res = await fetch(`https://api.cloudinary.com/v1_1/${CLOUDINARY_CLOUD_NAME}/auto/upload`, {
        method: "POST", body: form
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.error?.message || "yükleme hatası");
      const fileName = data.original_filename + (data.format ? "." + data.format : "");
      await addDoc(activeCollection(), {
        sender: me, type: "file", resourceType: data.resource_type,
        url: data.secure_url, fileName, createdAt: serverTimestamp()
      });
      setSideMsg("");
    } catch (err) {
      setSideMsg("dosya yüklenemedi: " + err.message);
    }
  }

  // ---------- olaylar ----------
  window.addEventListener("DOMContentLoaded", () => {
    $("#tab-login").onclick = () => { $("#pane-login").classList.add("active"); $("#pane-register").classList.remove("active"); $("#tab-login").classList.add("active"); $("#tab-register").classList.remove("active"); setAuthMsg("", false); };
    $("#tab-register").onclick = () => { $("#pane-register").classList.add("active"); $("#pane-login").classList.remove("active"); $("#tab-register").classList.add("active"); $("#tab-login").classList.remove("active"); setAuthMsg("", false); };

    $("#login-btn").onclick = login;
    $("#register-btn").onclick = register;
    $("#logout-btn").onclick = logout;
    $("#start-chat-btn").onclick = sendFriendRequest;
    $("#create-group-btn").onclick = createGroup;
    $("#send-btn").onclick = sendMessage;
    $("#file-btn").onclick = () => $("#file-input").click();
    $("#file-input").onchange = (e) => { if (e.target.files[0]) uploadFile(e.target.files[0]); e.target.value = ""; };

    $("#login-pass").addEventListener("keydown", e => { if (e.key === "Enter") login(); });
    $("#reg-pass").addEventListener("keydown", e => { if (e.key === "Enter") register(); });
    $("#new-contact").addEventListener("keydown", e => { if (e.key === "Enter") sendFriendRequest(); });
    $("#message-input").addEventListener("keydown", e => { if (e.key === "Enter") sendMessage(); });
  });
</script>
<style>
  :root {
    --bg: #14171c; --panel: #1a1e25; --panel-2: #1f242c; --border: #2a2f38;
    --text: #d8dee9; --text-dim: #6b7280; --accent: #e8a33d; --ok: #7fb069; --danger: #e0645a;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; background: var(--bg); color: var(--text); font-family: 'JetBrains Mono', monospace; font-size: 14px; }
  .screen { display: none; height: 100%; }
  .screen.active { display: flex; }

  #screen-auth { align-items: center; justify-content: center; flex-direction: column; gap: 24px; }
  .logo { font-size: 22px; font-weight: 700; letter-spacing: -0.5px; }
  .logo::after { content: "█"; color: var(--accent); animation: blink 1s steps(1) infinite; margin-left: 2px; }
  @keyframes blink { 50% { opacity: 0; } }

  .auth-card { width: 320px; background: var(--panel); border: 1px solid var(--border); border-radius: 6px; padding: 20px; }
  .tabs { display: flex; margin-bottom: 16px; border-bottom: 1px solid var(--border); }
  .tab { flex: 1; text-align: center; padding: 8px 0; color: var(--text-dim); cursor: pointer; border-bottom: 2px solid transparent; }
  .tab.active { color: var(--accent); border-bottom-color: var(--accent); }
  .pane { display: none; flex-direction: column; gap: 10px; }
  .pane.active { display: flex; }

  label { color: var(--text-dim); font-size: 12px; }
  input[type=text], input[type=password] {
    width: 100%; background: var(--bg); border: 1px solid var(--border); color: var(--text);
    font-family: inherit; font-size: 14px; padding: 8px 10px; border-radius: 4px; outline: none;
  }
  input[type=text]:focus, input[type=password]:focus { border-color: var(--accent); }

  button {
    font-family: inherit; font-size: 13px; cursor: pointer; border-radius: 4px;
    border: 1px solid var(--border); background: var(--panel-2); color: var(--text); padding: 8px 12px;
  }
  button:hover { border-color: var(--accent); color: var(--accent); }
  button:disabled { opacity: 0.4; cursor: default; }
  button:disabled:hover { border-color: var(--border); color: var(--text); }
  .primary-btn { background: var(--accent); color: #1a1206; border-color: var(--accent); font-weight: 600; }
  .primary-btn:hover { opacity: 0.9; color: #1a1206; }

  #auth-msg { min-height: 16px; font-size: 12px; }

  #screen-chat { flex-direction: column; }
  .chat-header { display: flex; align-items: center; justify-content: space-between; padding: 10px 16px; border-bottom: 1px solid var(--border); background: var(--panel); }
  .chat-header .logo { font-size: 15px; }
  #me-label { color: var(--accent); }

  .chat-body { flex: 1; display: flex; min-height: 0; }

  .sidebar { width: 240px; border-right: 1px solid var(--border); background: var(--panel); display: flex; flex-direction: column; padding: 12px; gap: 4px; overflow-y: auto; }
  .sidebar-row { display: flex; gap: 6px; }
  .sidebar-row input { flex: 1; }
  #chat-side-msg { font-size: 11px; min-height: 14px; }
  .section-title { font-size: 11px; color: var(--text-dim); margin-top: 14px; margin-bottom: 4px; text-transform: lowercase; }
  .contact { padding: 8px; border-radius: 4px; cursor: pointer; color: var(--text-dim); border: 1px solid transparent; font-size: 13px; }
  .contact:hover { color: var(--text); }
  .contact.active { color: var(--accent); border-color: var(--border); background: var(--panel-2); }
  .empty-hint { color: var(--text-dim); font-size: 12px; line-height: 1.6; padding: 8px 4px; }
  .empty-hint.small { padding: 4px; font-size: 11px; }

  .request-row { display: flex; align-items: center; gap: 4px; font-size: 12px; padding: 6px 4px; border-bottom: 1px solid var(--border); flex-wrap: wrap; }
  .request-row button { padding: 3px 6px; font-size: 11px; }

  .chat-main { flex: 1; display: flex; flex-direction: column; min-width: 0; }
  .chat-main-header { padding: 10px 16px; border-bottom: 1px solid var(--border); color: var(--text-dim); font-size: 13px; }
  .chat-main-header span { color: var(--accent); }

  #messages { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 10px; }
  .msg { font-size: 13px; line-height: 1.5; word-break: break-word; }
  .msg-time { color: var(--text-dim); }
  .msg-sender { color: var(--text-dim); }
  .msg.mine .msg-sender { color: var(--accent); }
  .msg-body { margin-top: 2px; }
  .msg-media { max-width: 260px; max-height: 260px; display: block; border-radius: 4px; border: 1px solid var(--border); margin: 4px 0; }
  .dl-link, .file-chip { color: var(--accent); text-decoration: none; font-size: 12px; }
  .dl-link:hover, .file-chip:hover { text-decoration: underline; }
  .file-chip { display: inline-block; padding: 6px 10px; border: 1px solid var(--border); border-radius: 4px; background: var(--panel-2); }

  .input-row { display: flex; align-items: center; gap: 8px; padding: 10px 16px; border-top: 1px solid var(--border); background: var(--panel); }
  .prompt-chevron { color: var(--accent); }
  #message-input { flex: 1; }

  @media (max-width: 640px) {
    .sidebar { width: 150px; }
    .auth-card { width: 88vw; }
    .msg-media { max-width: 160px; max-height: 160px; }
  }
</style>
</head>
<body>

  <div id="screen-auth" class="screen active">
    <div class="logo">mamichat</div>
    <div class="auth-card">
      <div class="tabs">
        <div id="tab-login" class="tab active">giriş yap</div>
        <div id="tab-register" class="tab">kayıt ol</div>
      </div>

      <div id="pane-login" class="pane active">
        <label>kullanıcı adı</label>
        <input type="text" id="login-name" autocomplete="off">
        <label>şifre</label>
        <input type="password" id="login-pass">
        <button id="login-btn" class="primary-btn">giriş yap</button>
      </div>

      <div id="pane-register" class="pane">
        <label>kullanıcı adı</label>
        <input type="text" id="reg-name" autocomplete="off">
        <label>şifre</label>
        <input type="password" id="reg-pass">
        <button id="register-btn" class="primary-btn">kayıt ol</button>
      </div>

      <div id="auth-msg"></div>
    </div>
  </div>

  <div id="screen-chat" class="screen">
    <div class="chat-header">
      <div class="logo">mamichat</div>
      <div><span id="me-label"></span> &nbsp; <button id="logout-btn">çıkış</button></div>
    </div>

    <div class="chat-body">
      <div class="sidebar">
        <div class="sidebar-row">
          <input type="text" id="new-contact" placeholder="kullanıcı adı...">
          <button id="start-chat-btn">istek gönder</button>
        </div>
        <div id="chat-side-msg"></div>

        <div class="section-title">gelen istekler</div>
        <div id="request-list"></div>

        <div class="section-title">arkadaşların</div>
        <div id="friend-list"></div>

        <div class="section-title">gruplar &nbsp; <button id="create-group-btn">+ grup</button></div>
        <div id="group-list"></div>
      </div>

      <div class="chat-main">
        <div class="chat-main-header">konuşuyorsun: <span id="chat-partner">— kimseyle —</span></div>
        <div id="messages"></div>
        <div class="input-row">
          <button id="file-btn" disabled>📎</button>
          <input type="file" id="file-input" hidden>
          <span class="prompt-chevron">&gt;</span>
          <input type="text" id="message-input" placeholder="mesaj yaz..." disabled>
          <button id="send-btn" disabled>gönder</button>
        </div>
      </div>
    </div>
